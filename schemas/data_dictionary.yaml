schema_set_version: 2.7.0
status: p3_standard_export_contracts
spec_version: 0.3.0
rules:
  unknown_root_fields: reject
  implicit_business_defaults: forbidden
  timestamps: RFC3339_UTC_Z
  durations: integer_seconds
  solver_ticks: ceil_duration_seconds_over_tick_seconds
  canonical_ids: non_empty_whitespace_free_strings
  normalization_mapping: exact_profile_and_source_version_required
  unit_conversion_registry: schemas/rules/unit-conversion-registry.v1.yaml
  data_quality_rule_version: data-quality-rules.v1
  error_registry: schemas/rules/error-code-registry.v2.yaml
  schema_set_compatibility: additive_2_7_preserves_all_prior_schema_bytes_urns_and_document_versions_while_adding_p3_standard_export_manifest_and_job_v2
schemas:
  canonical-records.v1:
    path: schemas/json/canonical-records.v1.schema.json
    collections:
      - factories
      - workshops
      - production_lines
      - resource_groups
      - resources
      - calendars
      - products
      - routing_versions
      - routing_operations
      - routing_precedence_edges
      - routing_resource_options
      - demand_orders
      - production_orders
      - production_lots
      - execution_facts
      - operation_locks
    required_provenance: [source_system, source_version, source_record_id]
    p1_boundary: strict authority-neutral record shapes; no source mapping, normalization, validation, expansion, or builder behavior
    production_open: [OPEN-001, OPEN-002, OPEN-003, OPEN-004, OPEN-007, OPEN-008, OPEN-009, OPEN-013, OPEN-014, OPEN-015]
  import-package.v1:
    path: schemas/json/import-package.schema.json
    purpose: versioned import metadata envelope
    p0_boundary: canonical record fields remain opaque until P1 authority mapping
    production_open: [OPEN-002, OPEN-013, OPEN-015]
  import-package.v2:
    path: schemas/json/import-package.v2.schema.json
    records: canonical-records.v1
    required_versions: [schema_set_version, source_versions, normalization_rule_version, canonicalization_version]
    synthetic_provenance: required only when synthetic is true
    compatibility: not interchangeable with import-package.v1; v1 remains byte-for-byte preserved
    p1_boundary: Normalization produces deterministic bytes; cross-entity validation and common-ingress orchestration remain planned
    production_open: [OPEN-002, OPEN-013, OPEN-015]
  planning-snapshot.v1:
    path: schemas/json/planning-snapshot.schema.json
    required_fields:
      - snapshot_version
      - snapshot_id
      - cutoff_at
      - source_versions
      - rule_version
      - snapshot_hash
      - entity_counts
      - synthetic
    conditional_fields:
      scenario_id: required only when synthetic is true
    production_open: [OPEN-001, OPEN-015]
  planning-snapshot.v2:
    path: schemas/json/planning-snapshot.v2.schema.json
    payloads: [canonical-records.v1, operation_instances, operation_precedence_edges]
    provenance: [source_versions, rule_version, normalization_rule_version, expansion_version, canonicalization_version, import_package, import_quality_report]
    synthetic_provenance: required only when synthetic is true
    hash_format: sha256 lowercase hexadecimal; construction is owned by TASK-P1-08
    compatibility: not interchangeable with planning-snapshot.v1; v1 remains byte-for-byte preserved
    p1_boundary: immutable payload shape only; validation, expansion, hash builder, and persistence remain planned
    production_open: [OPEN-001, OPEN-002, OPEN-004, OPEN-007, OPEN-009, OPEN-015]
  planning-problem.v1:
    path: schemas/json/planning-problem.schema.json
    required_fields:
      - problem_version
      - snapshot_id
      - problem_builder_version
      - problem_hash
      - tick_seconds
      - horizon_start_utc
      - horizon_end_utc
      - resource_ids
      - operation_instances
      - precedence_edges
      - resource_unavailable_intervals
      - required_capabilities
    operation_duration_fields:
      - setup_seconds
      - cycle_seconds_per_unit
      - final_duration_seconds
      - duration_source
      - source_version
    production_open: [OPEN-004, OPEN-007, OPEN-009, OPEN-014, OPEN-015]
  planning-problem.v2:
    path: schemas/json/planning-problem.v2.schema.json
    schema_set_version: 2.3.0
    builder_version: planning-problem-builder.v2
    canonicalization_version: canonical-json.v1
    hash_projection_version: planning-problem-hash-projection.v2
    payloads: [delivery_demands, resources, operation_instances, historical_completion_anchors, precedence_edges, operation_locks, resource_unavailable_intervals]
    explicit_priority_provenance: required; missing, extra, boolean, non-positive, and unversioned values reject
    primary_resource_capacity: exactly 1; secondary capacity remains outside this contract
    lock_boundary: referenced lock retained when end_at_utc is after horizon_start_utc; expired lock excluded; interval is never clipped
    historical_boundary: completed predecessor to active successor retains an edge and a sourced completion anchor
    compatibility: not interchangeable with planning-problem.v1; v1 Schema, sample, default builder API, and fixed hash vectors remain preserved
    production_open: [OPEN-004, OPEN-005, OPEN-006, OPEN-007, OPEN-009, OPEN-010, OPEN-014, OPEN-015]
  planning-policy.v1:
    path: schemas/json/planning-policy.schema.json
    schema_set_version: 2.4.0
    data_plane: explicit SIMULATION or PRODUCTION; no inferred policy defaults
    hard_constraints: ordered C-001..C-011
    objective_stages: exactly OBJ-001 weighted tardiness minimization in P2
    provenance: [policy_id, policy_revision, policy_source, constraint_contract_version, objective_policy_version, canonicalization_version]
    p2_boundary: pure immutable policy contract only; no solver, constraint implementation, persistence, API, or Production policy values
    production_open: [OPEN-005, OPEN-006, OPEN-009, OPEN-010, OPEN-012, OPEN-015]
  solve-limits.v1:
    path: schemas/json/solve-limits.schema.json
    schema_set_version: 2.4.0
    data_plane: explicit SIMULATION or PRODUCTION; no implicit limits
    required_limits: [max_wall_time_seconds, max_workers, random_seed]
    provenance: [limits_id, limits_revision, limits_source, canonicalization_version]
    p2_boundary: pure immutable budget contract only; published sample is Simulation-only and is not a Production default or SLA
    production_open: [OPEN-006, OPEN-010, OPEN-011, OPEN-012, OPEN-015]
  planning-solution.v1:
    path: schemas/json/planning-solution.schema.json
    schema_set_version: 2.4.0
    statuses: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID, CANCELLED, FAILED]
    p2_objective: exactly one OBJ-001 weighted-tardiness stage; OBJ-002 and OBJ-003 remain deferred
    assignment_time_contract: integer solver ticks plus RFC3339 UTC instants and integer duration seconds
    evidence_kind: distinguishes CONTRACT_SAMPLE from SOLVER_RUN
    provenance: exact Problem v2, PlanningPolicy v1, and SolveLimits v1 references with fingerprints
    p2_boundary: candidate carrier and status contract only; no candidate is certified by this schema sample and ScheduleValidator remains later work
    production_open: [OPEN-004, OPEN-005, OPEN-006, OPEN-009, OPEN-010, OPEN-011, OPEN-012, OPEN-014, OPEN-015]
  solver-report.v1:
    path: schemas/json/solver-report.schema.json
    schema_set_version: 2.4.0
    statuses: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID, CANCELLED, FAILED]
    required_metrics: [objective_stage_results, timings, model_metrics, memory_peak_mb]
    required_versions: [spec_version, schema_set_version, canonicalization_version, constraint_contract_version, objective_policy_version, state_machine_contract_version, error_registry_version]
    evidence_kind: distinguishes CONTRACT_SAMPLE from SOLVER_RUN
    p2_boundary: solver-neutral report/provenance contract only; no backend execution, benchmark, candidate validation, or Production evidence
    production_open: [OPEN-006, OPEN-009, OPEN-010, OPEN-011, OPEN-012, OPEN-015]
  kpi.v1:
    path: schemas/json/kpi.schema.json
    groups: [delivery, planning, resources, stability, solver]
    production_open: [OPEN-006, OPEN-012]
  kpi.v2:
    path: schemas/json/kpi.v2.schema.json
    schema_set_version: 2.5.0
    lineage: [planning_run_id, snapshot, problem, solution, validation_report, solver_report, import_quality_report]
    groups: [delivery, planning, resources, stability, solver]
    delivery_metric: priority_weighted_tardiness_seconds is exact integer OBJ-001 measurement
    utilization_denominator: horizon available calendar seconds after union of unavailable intervals
    zero_available_representation: utilization is null
    stability_boundary: NOT_APPLICABLE_NO_BASE_SCHEDULE with null metrics; no ChangeReport or dynamic Replan
    synthetic_provenance: required only when synthetic is true
    compatibility: non-interchangeable with kpi.v1; kpi.v1 bytes and semantics remain unchanged
    production_open: [OPEN-006, OPEN-010, OPEN-012, OPEN-015]
  export-manifest.v1:
    path: schemas/json/export-manifest.schema.json
    schema_set_version: 2.5.0
    package_profile: p2-internal-export.v1
    publishable: false
    required_payloads: [schedule.json, schedule_operations.csv, order_summary.csv, resource_load.csv, kpi.json, validation_report.json, solver_report.json, import_quality_report.json, scenario_manifest.json]
    deferred_payloads: [benchmark_report.json, change_report.json]
    state_boundary: no ScheduleVersion, ExportJob, approval, publication, or external transfer
    identity: content-derived package_id plus per-file SHA-256, bytes, and CSV row counts
    production_open: [OPEN-002, OPEN-006, OPEN-010, OPEN-015]
  export-manifest.v2:
    path: schemas/json/export-manifest.v2.schema.json
    schema_set_version: 2.7.0
    package_profile: p3-standard-export.v1
    source_state: PUBLISHED ScheduleVersion with completed internal Simulation publication
    required_payloads: [schedule_version.json, planning_solution.json, schedule_operations.csv, order_summary.csv, resource_load.csv, kpi.json, validation_report.json, solver_report.json, import_quality_report.json, scenario_manifest.json, publication_result.json, standard_package.xlsx]
    deferred_payloads: [benchmark_report.json, change_report.json]
    identity: content-derived package_id plus per-file SHA-256, bytes, CSV rows, and XLSX sheet count
    xlsx_safety: deterministic ZIP; no formula, macro, external link, or active content
    compatibility: additive and non-interchangeable with export-manifest.v1; all P2 bytes remain frozen
    p3_boundary: Simulation-internal package only; no external transfer, API, UI, P4 ChangeReport, or Production readiness
    production_open: [OPEN-002, OPEN-010, OPEN-012, OPEN-015]
  schedule-version.v1:
    path: schemas/json/schedule-version.schema.json
    schema_set_version: 2.6.0
    state_authority: state-machines.v1
    content: immutable assignments and operation locks with canonical content fingerprint
    lineage: [planning_run_id, snapshot, problem, planning_solution, validation_report, kpi, solver_report, code_commit]
    publication_target: SIMULATION_INTERNAL only; Production publication is unrepresentable in v1
    compatibility: new non-interchangeable document; PlanningSolution and all P2 bytes remain unchanged
    p3_boundary: carrier and pure precheck only; no persistence, transition, authorization, API, UI, worker, or publication behavior
    production_open: [OPEN-002, OPEN-010, OPEN-015]
  workspace-query.v1:
    path: schemas/json/workspace-query.schema.json
    schema_set_version: 2.6.0
    views: [DATA_HEALTH, IMPORT_RUNS, PLANNING_RUNS, ORDERS, OPERATIONS, RESOURCES, CALENDARS, GANTT, RESOURCE_LOAD, KPI, DIAGNOSTICS, LOCKS, AUDIT, VERSION_COMPARISON]
    determinism: stable sort, explicit filters, opaque cursor, query fingerprint, authoritative version, freshness, and server-observed count
    authority: allowed_actions is server-derived and does not grant capability
    compatibility: new strict request/result envelope
    production_open: [OPEN-002, OPEN-010, OPEN-015]
  workspace-command.v1:
    path: schemas/json/workspace-command.schema.json
    schema_set_version: 2.6.0
    preconditions: [source_id, expected_state, expected_content_fingerprint, data_plane, target]
    idempotency: explicit key and scope plus canonical request fingerprint
    authority: authenticated principal and role are intentionally absent from the client body
    copy_on_write: edit and lock intents never authorize in-place ScheduleVersion mutation
    compatibility: new strict discriminated command envelope
    production_open: [OPEN-002, OPEN-010, OPEN-015]
  schedule-version-comparison.v1:
    path: schemas/json/schedule-version-comparison.schema.json
    schema_set_version: 2.6.0
    identity: two distinct immutable version references plus canonical comparison fingerprint
    deltas: operation and KPI read-model deltas only
    p3_boundary: not an execution or dynamic planning artifact
    compatibility: new non-interchangeable read carrier
    production_open: [OPEN-002, OPEN-010, OPEN-015]
  audit-event.v1:
    path: schemas/json/audit-event.schema.json
    schema_set_version: 2.6.0
    append_only: carrier requires stable identity, actor reference, resolved capability, sanitized intent, lineage, before/after, result, and trace
    no_leak: raw credentials, secrets, SQL, and stack data are forbidden by contract and pure precheck
    error_namespaces: PRODUCT and WORKSPACE_CONTROL remain explicit and non-interchangeable
    p3_boundary: persistence and transactional append behavior remain TASK-P3-03 and later
    production_open: [OPEN-002, OPEN-010, OPEN-015]
  publication-result.v1:
    path: schemas/json/publication-result.schema.json
    schema_set_version: 2.6.0
    data_plane: SIMULATION only
    target: SIMULATION_INTERNAL only
    idempotency: same logical result is represented with a persisted reference, replay flag, and canonical result fingerprint
    compatibility: new successful-result carrier; rejected attempts use the separate error carrier
    p3_boundary: no publication behavior is implemented by this release
    production_open: [OPEN-002, OPEN-010, OPEN-015]
  export-job.v1:
    path: schemas/json/export-job.schema.json
    schema_set_version: 2.6.0
    state_authority: state-machines.v1
    source_state: PUBLISHED ScheduleVersion only
    target: SIMULATION_INTERNAL only
    lifecycle_fields: [attempt, lease_reference, heartbeat_at_utc, artifact_manifest, error, timestamps]
    error_namespace: EXPORT_FAILED remains workspace-control.v1 and is not a global product error code
    p3_boundary: no repository, job runner, package write, or external transfer behavior
    production_open: [OPEN-002, OPEN-010, OPEN-015]
  export-job.v2:
    path: schemas/json/export-job.v2.schema.json
    schema_set_version: 2.7.0
    state_authority: state-machines.v1
    source_state: PUBLISHED ScheduleVersion only
    target: SIMULATION_INTERNAL only
    artifact_manifest: export-manifest.v2 only
    compatibility: additive and non-interchangeable with export-job.v1; no state pair changed
    p3_boundary: internal package/job only; API/UI remain TASK-P3-10 and Production/external transfer remain forbidden
    production_open: [OPEN-002, OPEN-010, OPEN-012, OPEN-015]
  error.v1:
    path: schemas/json/error.schema.json
    p0_boundary: category and envelope only; concrete code registry belongs to TASK-P0-04
  validation-report.v1:
    path: schemas/json/validation-report.schema.json
    p0_boundary: top-level and violation envelope only; C-ID rule sheet belongs to TASK-P0-04 and mutation evidence to TASK-P0-07
  error.v2:
    path: schemas/json/error.v2.schema.json
    compatibility: non-interchangeable document version; error.v1 remains unchanged and separately valid
    codes: schemas/rules/error-code-registry.v1.yaml
  error.v3:
    path: schemas/json/error.v3.schema.json
    compatibility: non-interchangeable document version; error.v1/v2 remain unchanged and separately valid
    codes: schemas/rules/error-code-registry.v2.yaml
    required_detail_fields: [entity_type, entity_id, field, observed_value, expected_contract, source_location, action]
  import-quality-report.v1:
    path: schemas/json/import-quality-report.schema.json
    input: import-package.v2
    rule_version: data-quality-rules.v1
    error_document: error.v3
    error_registry: error-code-registry.v2
    determinism: stable issue ordering and content-derived report_id; no generated_at
    p1_boundary: canonical structure/reference/DAG/resource/capability/time/duration/unit evaluation only; no expansion, Snapshot, Problem, ScheduleValidator, or Solver
  validation-report.v2:
    path: schemas/json/validation-report.v2.schema.json
    compatibility: non-interchangeable document version; validation-report.v1 remains unchanged and separately valid
    hard_constraints: C-001..C-011
    rule_sheet: schemas/rules/constraint-rule-sheet.v1.yaml
    mutation_evidence: planned for TASK-P0-07
  state-transition.v1:
    path: schemas/json/state-transition.schema.json
    transition_authority: schemas/rules/state-machines.v1.yaml
    p0_boundary: transition authorization only; persistence and business actions are not implemented
  constraint-rule-sheet.v1:
    path: schemas/rules/constraint-rule-sheet.v1.yaml
    active_constraints: C-001..C-011
    deferred_constraints: C-012..C-018
    p0_boundary: metadata completeness only; candidate schedule evaluation belongs to TASK-P0-07/P2
  unit-conversion-registry.v1:
    path: schemas/rules/unit-conversion-registry.v1.yaml
    dimension: duration
    exact_source_units: [s, min, h]
    canonical_target_unit: second
    arithmetic: positive integer numerator and denominator; non-integral seconds reject
    compatibility: additive in schema set 2.1.0; Import v2 document retains schema_set_version 2.0.0
    production_open: [OPEN-013]
  capability-registry.v1:
    path: schemas/rules/capability-registry.v1.yaml
    p0_boundary: V1_SUPPORTED means contract scope, not current implementation evidence
  error-code-registry.v1:
    path: schemas/rules/error-code-registry.v1.yaml
    categories: [DATA_ERROR, UNSUPPORTED_CAPABILITY, MODEL_INVALID, INFEASIBLE, NO_SOLUTION_WITHIN_LIMIT, VALIDATION_FAILED, SYSTEM_ERROR]
  error-code-registry.v2:
    path: schemas/rules/error-code-registry.v2.yaml
    compatibility: additive; retains all 19 v1 mappings and adds four P1 data-quality codes
    p1_gate_codes: [ROUTE_CYCLE, MISSING_RESOURCE, UNIT_CONVERSION_ERROR, MISSING_DURATION]
  state-machines.v1:
    path: schemas/rules/state-machines.v1.yaml
    machines: [PLANNING_RUN, SCHEDULE_VERSION, EXPORT_JOB]
  factory-profile.v1:
    path: schemas/scenario/factory-profile.schema.json
    asset_version_field: profile_version
    isolation: synthetic_only must be true
    p0_boundary: versioned distribution shape only; no Production defaults or generated factory records
    simulation_assumptions: [SIM-ASSUMPTION-001, SIM-ASSUMPTION-004]
  scenario-spec.v1:
    path: schemas/scenario/scenario-spec.schema.json
    asset_version_field: scenario_version
    deterministic_inputs: [factory_profile, generator, seed, required_capabilities]
    isolation: synthetic_only must be true
    p0_boundary: expected behavior is a contract, not Solver or Validator execution evidence
    simulation_assumptions: [SIM-ASSUMPTION-002, SIM-ASSUMPTION-004, SIM-ASSUMPTION-005]
  scenario-manifest.v1:
    path: schemas/scenario/scenario-manifest.schema.json
    provenance_fields: [scenario, factory_profile, generator, seed, generated_at, dataset_hash]
    hash_rule: generated_at is excluded from canonical Import package dataset_hash
    target_environments: [development, test, benchmark]
    p0_boundary: manifest references an empty Standard Import v1 envelope; canonical entity records remain P1
