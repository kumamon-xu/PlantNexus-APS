[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "plantnexus-aps"
version = "0.0.0"
description = "PlantNexus APS executable-specification skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pyright==1.1.411",
  "pytest==8.4.1",
  "PyYAML==6.0.2",
  "ruff==0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.plantnexus-aps.versions]
spec = "0.3.0"
schema = "1.1.0"
code = "0.0.0"
