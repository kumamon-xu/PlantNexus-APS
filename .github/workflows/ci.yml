name: PlantNexus repository gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LANG: C.UTF-8

concurrency:
  group: plantnexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Classify validation profile
        id: profile
        env:
          PLANTNEXUS_CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLANTNEXUS_CI_CHANGE_HEAD: ${{ github.sha }}
        run: >-
          python scripts/ci_validation_profile.py classify
          --base "${PLANTNEXUS_CI_CHANGE_BASE}"
          --head "${PLANTNEXUS_CI_CHANGE_HEAD}"
          --report build/validation/ci-validation-profile.json
          --github-output "${GITHUB_OUTPUT}"

      - name: Upload validation profile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-profile-${{ github.run_id }}
          path: build/validation/ci-validation-profile.json
          if-no-files-found: error

  docs_validation:
    needs: classify
    if: ${{ needs.classify.outputs.profile == 'DOCS_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate changed public documentation
        env:
          PLANTNEXUS_CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLANTNEXUS_CI_CHANGE_HEAD: ${{ github.sha }}
        run: >-
          python scripts/ci_validation_profile.py validate-docs
          --base "${PLANTNEXUS_CI_CHANGE_BASE}"
          --head "${PLANTNEXUS_CI_CHANGE_HEAD}"
          --report build/validation/ci-public-docs-validation.json

      - name: Upload public documentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-public-docs-${{ github.run_id }}
          path: build/validation/ci-public-docs-validation.json
          if-no-files-found: error

  full_preflight:
    needs: classify
    if: ${{ needs.classify.outputs.profile == 'FULL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependency-free CI preflight
        run: >-
          python scripts/ci_preflight.py
          --root .
          --report build/validation/ci-preflight.json
          --ci-mode

      - name: Upload CI preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-preflight-${{ github.run_id }}
          path: build/validation/ci-preflight.json
          if-no-files-found: error

  full_backend:
    needs: [classify, full_preflight]
    if: ${{ needs.classify.outputs.profile == 'FULL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLANTNEXUS_CODE_COMMIT: ${{ github.sha }}
      PLANTNEXUS_POSTGRES_PASSWORD: ci-contract-only-not-a-secret
      PLANTNEXUS_CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Sync exact lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright backend/app backend/tests

      - name: Repository test suites
        run: |
          mkdir -p build/validation
          uv run pytest -q \
            --junitxml=build/validation/ci-backend-tests.xml \
            backend/tests/unit \
            backend/tests/contract \
            backend/tests/simulation \
            backend/tests/golden \
            backend/tests/validation \
            backend/tests/integration \
            backend/tests/property \
            backend/tests/security

      - name: Upload Backend validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-backend-${{ github.run_id }}
          path: build/validation/ci-backend-tests.xml
          if-no-files-found: error

  full_validation:
    needs: [classify, full_preflight]
    if: ${{ needs.classify.outputs.profile == 'FULL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLANTNEXUS_CODE_COMMIT: ${{ github.sha }}
      PLANTNEXUS_POSTGRES_PASSWORD: ci-contract-only-not-a-secret
      PLANTNEXUS_CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify exact Frontend runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Sync exact lock
        run: uv sync --locked

      - name: Existing executable contracts
        run: |
          uv run python -m app.planning.validation.rule_sheet --report build/validation/ci-rule-contracts.json
          uv run python -m app.simulation.generators.contract_check --report build/validation/ci-simulation-contracts.json
          uv run python -m app.simulation.scenarios.golden_fixture --fixture fixtures/deterministic/SIM-MINIMAL-001 --report build/validation/ci-golden.json
          uv run python -m app.planning.validation.mutation_check --root . --report build/validation/ci-validator-mutations.json

      - name: P1 common ingress gate
        run: >-
          uv run python -m app.application.p1_gate_report
          --root .
          --scenario fixtures/synthetic/SIM-P1-INGRESS-001
          --repeat 2
          --report build/validation/ci-p1-data-pipeline.json

      - name: PlanningProblem v1 and v2 contract evidence
        run: >-
          uv run python -m app.planning.problem.contract_check
          --root .
          --report build/validation/ci-planning-problem-contracts.json

      - name: Planning machine contract evidence
        run: >-
          uv run python -m app.planning.policy.contract_check
          --root .
          --report build/validation/ci-planning-machine-contracts.json

      - name: CP-SAT backend foundation evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.contract_check
          --root .
          --report build/validation/ci-solver-backend-foundation.json

      - name: Formal independent schedule validator evidence
        run: >-
          uv run python -m app.planning.validation.problem_validator_check
          --root .
          --report build/validation/ci-formal-schedule-validator.json

      - name: CP-SAT core model evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.core_model_check
          --root .
          --report build/validation/ci-cp-sat-core-model.json

      - name: CP-SAT temporal calendar and material model evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.temporal_model_check
          --root .
          --report build/validation/ci-cp-sat-temporal-model.json

      - name: CP-SAT execution fact and hard lock model evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.fact_lock_model_check
          --root .
          --report build/validation/ci-cp-sat-fact-lock-model.json

      - name: OBJ-001 and Global CP-SAT strategy evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.objective_strategy_check
          --root .
          --report build/validation/ci-objective-strategy.json

      - name: P2 Golden scenario property and mutation correctness evidence
        run: >-
          uv run python -m app.simulation.scenarios.p2_correctness
          --root .
          --report build/validation/ci-p2-correctness.json

      - name: P2 deterministic reference scheduler evidence
        run: >-
          uv run python -m app.simulation.baselines.reference_schedulers
          --root .
          --report build/validation/ci-reference-schedulers.json

      - name: P2 KPI SolverReport and internal export evidence
        run: >-
          uv run python -m app.exporters.contract_check
          --root .
          --report build/validation/ci-p2-output-contracts.json

      - name: P3 workspace schema contract evidence
        run: >-
          uv run python -m app.domain.workspace_contract_check
          --root .
          --report build/validation/ci-p3-workspace-contracts.json

      - name: P4 dynamic replanning machine contract evidence
        run: >-
          uv run python -m app.domain.execution_contract_check
          --root .
          --report build/validation/ci-p4-machine-contracts.json

      - name: P8 canonical ingress and PlanningRun machine contract evidence
        run: >-
          uv run python scripts/p8_machine_contract_check.py
          --root .
          --report build/validation/ci-p8-machine-contracts.json

      - name: P6 duration prediction machine contract evidence
        run: >-
          uv run python scripts/p6_duration_contract_check.py
          --root .
          --report build/validation/ci-p6-duration-contracts.json

      - name: P6 feature label dataset evidence
        run: >-
          uv run python scripts/p6_duration_dataset_check.py
          --root .
          --report build/validation/ci-p6-duration-dataset.json

      - name: P6 versioned baseline model and replay evidence
        run: >-
          uv run python scripts/p6_duration_model_check.py
          --root .
          --report build/validation/ci-p6-duration-model.json
          --model-artifact build/validation/ci-p6-duration-baseline-model.json
          --manifest-artifact build/validation/ci-p6-duration-model-manifest.json
          --replay-artifact build/validation/ci-p6-duration-model-replay.json
          &&
          uv run python scripts/p6_duration_evaluation_check.py
          --root .
          --report build/validation/ci-p6-duration-evaluation.json
          &&
          uv run python scripts/p6_duration_runtime_check.py
          --root .
          --offline-gate-report build/validation/ci-p6-duration-evaluation.json
          --report build/validation/ci-p6-duration-runtime.json

      - name: P3 workspace persistence evidence
        run: >-
          uv run python -m app.infrastructure.workspace_persistence_check
          --root .
          --report build/validation/ci-p3-persistence.json

      - name: P4 replan event persistence evidence
        run: >-
          uv run python -m app.infrastructure.replan_persistence_check
          --root .
          --report build/validation/ci-p4-replan-persistence.json

      - name: P4 ExecutionEvent fact projection evidence
        run: >-
          uv run python -m app.application.execution_fact_projection_check
          --root .
          --report build/validation/ci-p4-execution-fact-projection.json

      - name: P4 freeze window and effective lock evidence
        run: >-
          uv run python -m app.planning.problem.freeze_window_check
          --root .
          --report build/validation/ci-p4-freeze-window.json

      - name: P4 OBJ-002 stability and ChangeReport evidence
        run: >-
          uv run python -m app.planning.reporting.stability_change_report_check
          --root .
          --report build/validation/ci-p4-stability-change-report.json

      - name: P4 lexicographic replan solver and validator evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.replan_solver_check
          --root .
          --report build/validation/ci-p4-replan-solver.json

      - name: P4 replan application and ScheduleVersion lineage evidence
        run: >-
          uv run python -m app.application.replan_application_check
          --root .
          --report build/validation/ci-p4-replan-application.json

      - name: P4 deterministic Execution Simulator core evidence
        run: >-
          uv run python -m app.simulation.execution.simulator_check
          --root .
          --report build/validation/ci-p4-execution-simulator.json

      - name: P4 five-disruption continuous replay evidence
        run: >-
          uv run python -m app.simulation.scenarios.disruption_replay_check
          --root .
          --report build/validation/ci-p4-disruption-replay.json

      - name: P4 ChangeReport read model and export evidence
        run: >-
          uv run python -m app.exporters.change_report_output_check
          --root .
          --report build/validation/ci-p4-change-report-output.json

      - name: P3 reviewable ScheduleVersion lifecycle evidence
        run: >-
          uv run python -m app.application.schedule_version_lifecycle_check
          --root .
          --report build/validation/ci-p3-schedule-version-lifecycle.json

      - name: P3 workspace read model and comparison evidence
        run: >-
          uv run python -m app.application.workspace_read_model_check
          --root .
          --report build/validation/ci-p3-workspace-read-models.json

      - name: P3 schedule edit and lock command evidence
        run: >-
          uv run python -m app.application.schedule_command_check
          --root .
          --report build/validation/ci-p3-schedule-commands.json

      - name: P3 approval rejection and audit evidence
        run: >-
          uv run python -m app.application.approval_decision_check
          --root .
          --report build/validation/ci-p3-approval-decisions.json

      - name: P3 publication supersession and idempotency evidence
        run: >-
          uv run python -m app.application.publication_check
          --root .
          --report build/validation/ci-p3-publication.json

      - name: P3 ExportJob and standard package evidence
        run: >-
          uv run python -m app.application.export_job_check
          --root .
          --report build/validation/ci-p3-export-jobs.json

      - name: P3 planning workspace HTTP API evidence
        run: >-
          uv run python -m app.api.planning_workspace_check
          --root .
          --report build/validation/ci-p3-planning-workspace-api.json

      - name: P4 dynamic replanning HTTP API evidence
        run: >-
          uv run python -m app.api.replanning_check
          --root .
          --report build/validation/ci-p4-replanning-api.json

      - name: P3 Frontend locked install
        run: npm --prefix frontend ci

      - name: P3 Frontend point-in-time SCA evidence
        run: >-
          npm --prefix frontend run audit:sca --
          --report ../build/validation/ci-p3-frontend-sca.json

      - name: P3 Frontend license evidence
        run: >-
          npm --prefix frontend run licenses:check --
          --report ../build/validation/ci-p3-frontend-licenses.json

      - name: P3 Frontend lint and type contract
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck

      - name: P3 Frontend component and accessibility tests
        working-directory: frontend
        run: npm exec -- vitest --exclude=e2e/** --run

      - name: P3 Frontend Chromium runtime
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: P3 Frontend human-control and visualization browser evidence
        run: npm --prefix frontend run test:e2e -- --workers=1

      - name: P3 Frontend production build
        run: npm --prefix frontend run build

      - name: P3-13 Frontend human-control machine evidence
        run: >-
          npm --prefix frontend run evidence --
          --report ../build/validation/ci-p3-frontend.json

      - name: TASK-P3-16 Frontend bilingual localization machine evidence
        run: >-
          node frontend/scripts/i18n-evidence.mjs
          --report build/validation/ci-p3-frontend-i18n.json

      - name: TASK-P4-13 Dynamic replanning frontend machine evidence
        shell: bash
        run: |
          replay_parent="$(mktemp -d "${RUNNER_TEMP}/p4-replanning-replay.XXXXXX")"
          replay_root="${replay_parent}/checkout"
          cleanup_replay() {
            git worktree remove --force "${replay_root}" >/dev/null 2>&1 || true
            rmdir "${replay_parent}" >/dev/null 2>&1 || true
          }
          trap cleanup_replay EXIT

          git worktree add --detach "${replay_root}" "${GITHUB_SHA}"
          rm -- \
            "${replay_root}/backend/app/application/p5_portfolio_gate_report.py" \
            "${replay_root}/backend/app/application/p5_exit_gate_audit.py" \
            "${replay_root}/backend/tests/contract/test_p5_portfolio_gate_rejections.py" \
            "${replay_root}/backend/tests/contract/test_p5_exit_gate_rejections.py" \
            "${replay_root}/backend/tests/contract/test_p6_duration_contracts.py" \
            "${replay_root}/backend/app/duration_prediction/__init__.py" \
            "${replay_root}/backend/app/duration_prediction/dataset.py" \
            "${replay_root}/backend/tests/contract/test_p6_duration_dataset.py" \
            "${replay_root}/backend/app/duration_prediction/model.py" \
            "${replay_root}/backend/tests/contract/test_p6_duration_model.py" \
            "${replay_root}/backend/app/duration_prediction/evaluation.py" \
            "${replay_root}/backend/tests/contract/test_p6_duration_evaluation.py" \
            "${replay_root}/backend/tests/property/test_p6_duration_evaluation_properties.py" \
            "${replay_root}/backend/tests/validation/test_p6_duration_evaluation_mutations.py" \
            "${replay_root}/backend/app/duration_prediction/runtime.py" \
            "${replay_root}/backend/tests/p6_duration_runtime_support.py" \
            "${replay_root}/backend/tests/contract/test_p6_duration_runtime.py" \
            "${replay_root}/backend/tests/property/test_p6_duration_runtime_properties.py" \
            "${replay_root}/backend/tests/contract/test_p6_duration_runtime_security.py" \
            "${replay_root}/backend/tests/performance/test_p6_duration_runtime_performance.py" \
            "${replay_root}/backend/tests/validation/test_p6_duration_runtime_mutations.py" \
            "${replay_root}/backend/app/duration_prediction/planning_ingress.py" \
            "${replay_root}/backend/tests/p6_planning_integration_support.py" \
            "${replay_root}/backend/tests/contract/test_p6_planning_ingress_contract.py" \
            "${replay_root}/backend/tests/integration/test_p6_planning_ingress_integration.py" \
            "${replay_root}/backend/tests/property/test_p6_planning_integration_properties.py" \
            "${replay_root}/backend/tests/validation/test_p6_planning_integration_mutations.py" \
            "${replay_root}/backend/tests/unit/test_task_execution_automation.py" \
            "${replay_root}/backend/tests/integration/test_p5_portfolio_gate.py" \
            "${replay_root}/backend/tests/integration/test_p5_exit_gate.py" \
            "${replay_root}/schemas/json/duration-evaluation-report.schema.json" \
            "${replay_root}/schemas/json/duration-feature-record.schema.json" \
            "${replay_root}/schemas/json/duration-model-manifest.schema.json" \
            "${replay_root}/schemas/json/duration-prediction.schema.json" \
            "${replay_root}/schemas/samples/duration-evaluation-report.v1.synthetic.json" \
            "${replay_root}/schemas/samples/duration-feature-record.v1.future-leakage.invalid.json" \
            "${replay_root}/schemas/samples/duration-feature-record.v1.synthetic.json" \
            "${replay_root}/schemas/samples/duration-model-manifest.v1.incomplete-lineage.invalid.json" \
            "${replay_root}/schemas/samples/duration-model-manifest.v1.synthetic.json" \
            "${replay_root}/schemas/samples/duration-prediction.v1.candidate.synthetic.json" \
            "${replay_root}/schemas/samples/duration-prediction.v1.fallback.synthetic.json" \
            "${replay_root}/schemas/samples/duration-prediction.v1.invalid-quantiles.invalid.json" \
            "${replay_root}/schemas/samples/duration-prediction.v1.mixed-version.invalid.json" \
            "${replay_root}/schemas/samples/duration-prediction.v1.unknown-fallback.invalid.json" \
            "${replay_root}/backend/tests/contract/test_p8_machine_contracts.py" \
            "${replay_root}/schemas/json/canonical-ingress-request.schema.json" \
            "${replay_root}/schemas/json/canonical-ingress-result.schema.json" \
            "${replay_root}/schemas/json/planning-run.schema.json" \
            "${replay_root}/schemas/rules/headless-error-code-registry.v1.yaml" \
            "${replay_root}/schemas/samples/canonical-ingress-request.v1.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress-result.v1.accepted.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress-result.v1.rejected.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-authority.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-fingerprint.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-idempotency.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-plane.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-reference.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-scope.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-type.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-unknown-field.synthetic.json" \
            "${replay_root}/schemas/samples/canonical-ingress.v1.invalid-version.synthetic.json" \
            "${replay_root}/schemas/samples/planning-run.v1.completed.synthetic.json" \
            "${replay_root}/schemas/samples/planning-run.v1.created.synthetic.json" \
            "${replay_root}/schemas/samples/planning-run.v1.invalid-transition.synthetic.json"
          git -C "${replay_root}" restore \
            --source d0a83c58cb4a2d4afa76e8c8cff08441574e2e30 \
            -- backend/tests/integration/test_ci_contract.py
          git -C "${replay_root}" restore \
            --source d0a83c58cb4a2d4afa76e8c8cff08441574e2e30 \
            -- \
            backend/app/__init__.py \
            backend/app/application/execution_fact_projection_check.py \
            backend/app/application/export_job_check.py \
            backend/app/domain/execution_contract_check.py \
            backend/app/domain/workspace_contract_check.py \
            backend/app/planning/backends/cp_sat/replan_solver_check.py \
            backend/app/planning/problem/freeze_window_check.py \
            backend/app/planning/reporting/stability_change_report_check.py \
            backend/app/simulation/execution/simulator_check.py \
            backend/tests/contract/test_import_validation.py \
            backend/tests/contract/test_p3_export_contracts.py \
            backend/tests/contract/test_rule_contracts.py \
            backend/tests/contract/test_schema_contracts.py \
            backend/tests/contract/test_unit_conversion_registry.py \
            backend/tests/unit/test_check_docs.py \
            backend/tests/unit/test_ci_validation_profile.py \
            pyproject.toml \
            schemas/data_dictionary.yaml
          mkdir -p \
            "${replay_root}/build/playwright" \
            "${replay_root}/build/validation"
          cp build/playwright/results.json "${replay_root}/build/playwright/results.json"
          cp build/playwright/results.xml "${replay_root}/build/playwright/results.xml"
          cp -R build/playwright/html "${replay_root}/build/playwright/html"
          cp build/validation/ci-p4-replanning-api.json \
            "${replay_root}/build/validation/ci-p4-replanning-api.json"
          cp -R frontend/dist "${replay_root}/frontend/dist"

          cd "${replay_root}/frontend"
          node scripts/replanning-evidence.mjs \
            --report "${GITHUB_WORKSPACE}/build/validation/ci-p4-replanning-frontend.json"

      - name: P3 Gate Chromium replay 1
        working-directory: frontend
        env:
          PLANTNEXUS_P3_GATE_REPLAY_INDEX: "1"
        run: npm exec -- playwright test --config playwright.p3-gate.config.ts --workers=1

      - name: P3 Gate Chromium replay 2
        working-directory: frontend
        env:
          PLANTNEXUS_P3_GATE_REPLAY_INDEX: "2"
        run: npm exec -- playwright test --config playwright.p3-gate.config.ts --workers=1

      - name: P3 Gate Frontend semantic evidence
        working-directory: frontend
        run: >-
          node scripts/p3-gate-evidence.mjs
          --human-control-report ../build/validation/ci-p3-frontend.json
          --report ../build/validation/ci-p3-frontend-gate.json

      - name: P4 Gate Chromium replay 1
        working-directory: frontend
        env:
          PLANTNEXUS_P4_GATE_REPLAY_INDEX: "1"
        run: npm exec -- playwright test --config playwright.p4-gate.config.ts --workers=1

      - name: P4 Gate Chromium replay 2
        working-directory: frontend
        env:
          PLANTNEXUS_P4_GATE_REPLAY_INDEX: "2"
        run: npm exec -- playwright test --config playwright.p4-gate.config.ts --workers=1

      - name: P4 Gate Frontend semantic evidence
        working-directory: frontend
        run: >-
          node scripts/p4-gate-evidence.mjs
          --replanning-report ../build/validation/ci-p4-replanning-frontend.json
          --report ../build/validation/ci-p4-frontend-gate.json

      - name: Engineering contract
        run: >-
          uv run python -m app.infrastructure.contract_check
          --root .
          --report build/validation/ci-engineering.json

      - name: Container configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Documentation and task diff
        run: |
          uv run python scripts/check_docs.py
          uv run python scripts/check_docs.py --discover-task-from "${PLANTNEXUS_CI_CHANGE_BASE}" --check-diff --report build/traceability/ci-current-task-report.json

      - name: P2 XS BenchmarkRunner evidence
        env:
          PLANTNEXUS_BENCHMARK_PROFILE: xs
        run: >-
          uv run python scripts/run_benchmark.py
          --profile "${PLANTNEXUS_BENCHMARK_PROFILE}"
          --report build/benchmarks/ci-xs.json

      - name: P2 vertical slice Gate evidence
        run: >-
          uv run python -m app.application.p2_gate_report
          --root .
          --repeat 2
          --report build/validation/ci-p2-vertical-slice-gate.json

      - name: P3 vertical slice Gate evidence
        run: >-
          uv run python -m app.application.p3_gate_report
          --root .
          --repeat 2
          --frontend-report build/validation/ci-p3-frontend-gate.json
          --p2-report build/validation/ci-p2-vertical-slice-gate.json
          --report build/validation/ci-p3-vertical-slice-gate.json

      - name: P4 vertical slice Gate evidence
        run: |
          uv run python -m app.application.p4_gate_report --root . --repeat 2 --frontend-report build/validation/ci-p4-frontend-gate.json --p2-report build/validation/ci-p2-vertical-slice-gate.json --p3-report build/validation/ci-p3-vertical-slice-gate.json --report build/validation/ci-p4-vertical-slice-gate.json
          uv run python -m app.application.p5_portfolio_gate_report --root . --repeat 2 --portfolio-manifest docs/core/p5-portfolio-amendment-manifest.md --frontend-report build/validation/ci-p4-frontend-gate.json --p2-report build/validation/ci-p2-vertical-slice-gate.json --p3-report build/validation/ci-p3-vertical-slice-gate.json --report build/validation/ci-p5-portfolio-gate.json

      - name: P5 capability qualification fresh evidence
        run: >-
          uv run python scripts/p5_capability_qualification.py
          --root .
          --manifest fixtures/simulation/p5/qualification/evidence-manifest.v1.json
          --report build/validation/ci-p5-capability-qualification.json

      - name: P5 Exit Gate independent audit evidence
        run: >-
          uv run python -m app.application.p5_exit_gate_audit
          --root .
          --provider-observation docs/p5-exit-gate-audit-observations.v1.json
          --qualification-report build/validation/ci-p5-capability-qualification.json
          --p5-gate-report build/validation/ci-p5-portfolio-gate.json
          --p4-gate-report build/validation/ci-p4-vertical-slice-gate.json
          --p4-exit-observation docs/p4-exit-gate-audit-observations.v1.json
          --report build/validation/ci-p5-exit-gate-audit.json

      - name: Build package
        run: uv build

      - name: Upload machine evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-evidence-${{ github.run_id }}
          path: |
            build/validation/*.json
            build/traceability/*.json
            build/benchmarks/*.json
            build/playwright/**
          if-no-files-found: error

  validate:
    needs: [classify, docs_validation, full_preflight, full_backend, full_validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PLANTNEXUS_CI_PROFILE: ${{ needs.classify.outputs.profile }}
      PLANTNEXUS_CLASSIFY_RESULT: ${{ needs.classify.result }}
      PLANTNEXUS_DOCS_RESULT: ${{ needs.docs_validation.result }}
      PLANTNEXUS_PREFLIGHT_RESULT: ${{ needs.full_preflight.result }}
      PLANTNEXUS_BACKEND_RESULT: ${{ needs.full_backend.result }}
      PLANTNEXUS_FULL_RESULT: ${{ needs.full_validation.result }}
    steps:
      - name: Enforce fail-closed validation routing
        shell: bash
        run: |
          test "${PLANTNEXUS_CLASSIFY_RESULT}" = "success"
          case "${PLANTNEXUS_CI_PROFILE}" in
            FULL)
              test "${PLANTNEXUS_PREFLIGHT_RESULT}" = "success"
              test "${PLANTNEXUS_BACKEND_RESULT}" = "success"
              test "${PLANTNEXUS_FULL_RESULT}" = "success"
              test "${PLANTNEXUS_DOCS_RESULT}" = "skipped"
              ;;
            DOCS_ONLY)
              test "${PLANTNEXUS_DOCS_RESULT}" = "success"
              test "${PLANTNEXUS_PREFLIGHT_RESULT}" = "skipped"
              test "${PLANTNEXUS_BACKEND_RESULT}" = "skipped"
              test "${PLANTNEXUS_FULL_RESULT}" = "skipped"
              ;;
            *)
              echo "Unknown or missing CI validation profile" >&2
              exit 1
              ;;
          esac
