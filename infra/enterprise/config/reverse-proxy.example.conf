# Replace placeholders and validate with the approved proxy before deployment.
# TLS terminates here; this template grants no Production authorization.
server {
    listen 443 ssl;
    server_name __REQUIRED_API_DOMAIN__;
    ssl_certificate /etc/plantnexus/tls/server.crt;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 8m;
    location / {
        proxy_pass http://__REQUIRED_API_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
