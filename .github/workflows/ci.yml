      - name: P3 Gate Chromium replay 1
        working-directory: frontend
        env:
          PLANTNEXUS_P3_GATE_REPLAY_INDEX: "1"
        run: npm exec -- playwright test --config playwright.p3-gate.config.ts --workers=1

      - name: P3 Gate Chromium replay 2
        working-directory: frontend
        env:
          PLANTNEXUS_P3_GATE_REPLAY_INDEX: "2"
        run: npm exec -- playwright test --config playwright.p3-gate.config.ts --workers=1

      - name: P3 Gate Frontend semantic evidence
        working-directory: frontend
        run: >-
          node scripts/p3-gate-evidence.mjs
          --human-control-report ../build/validation/ci-p3-frontend.json
          --report ../build/validation/ci-p3-frontend-gate.json

      - name: P4 Gate Chromium replay 1
        working-directory: frontend
        env:
          PLANTNEXUS_P4_GATE_REPLAY_INDEX: "1"
        run: npm exec -- playwright test --config playwright.p4-gate.config.ts --workers=1

      - name: P4 Gate Chromium replay 2
        working-directory: frontend
        env:
          PLANTNEXUS_P4_GATE_REPLAY_INDEX: "2"
        run: npm exec -- playwright test --config playwright.p4-gate.config.ts --workers=1

      - name: P4 Gate Frontend semantic evidence
        working-directory: frontend
        run: >-
          node scripts/p4-gate-evidence.mjs
          --replanning-report ../build/validation/ci-p4-replanning-frontend.json
          --report ../build/validation/ci-p4-frontend-gate.json

      - name: P8 optional Headless Frontend Chromium distribution evidence
        run: npm --prefix frontend run test:p8:e2e -- --workers=1

      - name: P8 optional Headless Frontend production distribution
        run: |
          npm --prefix frontend run build:headless
          npm --prefix frontend run package:headless

      - name: P8 optional Headless Frontend isolation evidence
        run: >-
          uv run python scripts/p8_frontend_distribution_check.py
          --root .
          --distribution-manifest build/frontend/frontend-distribution-manifest.v1.json
          --browser-report build/playwright/p8-distribution/results.json
          --sca-report build/validation/ci-p3-frontend-sca.json
          --license-report build/validation/ci-p3-frontend-licenses.json
          --runtime-report build/validation/ci-p8-runtime-release.json
          --release-output build/release
          --distribution-report build/validation/ci-p8-frontend-distribution.json
          --client-report build/validation/ci-p8-frontend-client.json
          --browser-security-report build/validation/ci-p8-frontend-browser-security.json
          --backend-only-report build/validation/ci-p8-frontend-backend-only.json

      - name: Download same-run operations evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: plantnexus-ci-operations-${{ github.run_id }}
          path: build/shared-operations

      - name: Prepare declared Runtime metadata for independent audit
        run: python -m scripts.ci_execution prepare-runtime --report build/validation/ci-audit-runtime-source.json

      - name: P8 Runtime Extension product corrective evidence
        run: |
          uv run pytest -q backend/tests/*/test_p8_*.py tests/p8 --junitxml=build/validation/ci-p8-tests.xml
          python -m scripts.ci_execution verify-shared --job full_operations --downloads build/shared-operations
          uv run python -m scripts.p8_runtime_product_integration_check --root . --junit build/validation/ci-p8-tests.xml --operations-deployment build/shared-operations/ci-p8-operations-deployment.json --operations-recovery build/shared-operations/ci-p8-operations-recovery.json --report build/validation/ci-p8-18-runtime-product-corrective.json --invocation-report build/validation/ci-p8-18-runtime-extension-invocation.json --kit-report build/validation/ci-p8-18-developer-kit-binding.json --output-report build/validation/ci-p8-18-headless-output.json --deployment-report build/validation/ci-p8-18-extension-deployment-recovery.json --security-report build/validation/ci-p8-18-security.json --benchmark-report build/benchmarks/ci-p8-18-runtime-product-corrective.json

      - name: P8 Headless Extension platform requalification Gate evidence
        run: |
          uv run python -m scripts.p8_headless_extension_platform_requalification_gate \
            --root . \
            --profile benchmarks/p8/headless-extension-platform-gate-profile.v1.json \
            --junit build/validation/ci-p8-tests.xml \
            --runtime-release build/validation/ci-p8-runtime-release.json \
            --runtime-security build/validation/ci-p8-runtime-release-security.json \
            --runtime-migration build/validation/ci-p8-runtime-release-migration.json \
            --formal-validator build/validation/ci-formal-schedule-validator.json \
            --validator-mutations build/validation/ci-validator-mutations.json \
            --frontend-distribution build/validation/ci-p8-frontend-distribution.json \
            --frontend-client build/validation/ci-p8-frontend-client.json \
            --frontend-security build/validation/ci-p8-frontend-browser-security.json \
            --frontend-backend-only build/validation/ci-p8-frontend-backend-only.json \
            --operations-deployment build/shared-operations/ci-p8-operations-deployment.json \
            --operations-observability build/shared-operations/ci-p8-operations-observability.json \
            --operations-recovery build/shared-operations/ci-p8-operations-recovery.json \
            --operations-runbooks build/shared-operations/ci-p8-operations-runbooks.json \
            --corrective build/validation/ci-p8-18-runtime-product-corrective.json \
            --corrective-invocation build/validation/ci-p8-18-runtime-extension-invocation.json \
            --corrective-kit build/validation/ci-p8-18-developer-kit-binding.json \
            --corrective-output build/validation/ci-p8-18-headless-output.json \
            --corrective-deployment build/validation/ci-p8-18-extension-deployment-recovery.json \
            --corrective-security build/validation/ci-p8-18-security.json \
            --corrective-benchmark build/benchmarks/ci-p8-18-runtime-product-corrective.json \
            --report build/validation/ci-p8-19-headless-extension-platform-requalification.json \
            --blocker-disposition-report build/validation/ci-p8-19-blocker-disposition.json \
            --provenance-report build/validation/ci-p8-19-provenance.json \
            --compatibility-report build/validation/ci-p8-19-compatibility.json \
            --security-report build/validation/ci-p8-19-security.json \
            --recovery-report build/validation/ci-p8-19-recovery.json \
            --benchmark-report build/benchmarks/ci-p8-19-headless-extension-platform-requalification.json

      - name: P8 Exit Gate independent audit evidence
        run: |
          uv run python -m scripts.p8_exit_gate_audit \
            --root . \
            --provider-observation docs/p8-exit-gate-audit-observations.v1.json \
            --profile benchmarks/p8/headless-extension-platform-gate-profile.v1.json \
            --junit build/validation/ci-p8-tests.xml \
            --runtime-release build/validation/ci-p8-runtime-release.json \
            --runtime-security build/validation/ci-p8-runtime-release-security.json \
            --runtime-migration build/validation/ci-p8-runtime-release-migration.json \
            --formal-validator build/validation/ci-formal-schedule-validator.json \
            --validator-mutations build/validation/ci-validator-mutations.json \
            --frontend-distribution build/validation/ci-p8-frontend-distribution.json \
            --frontend-client build/validation/ci-p8-frontend-client.json \
            --frontend-security build/validation/ci-p8-frontend-browser-security.json \
            --frontend-backend-only build/validation/ci-p8-frontend-backend-only.json \
            --operations-deployment build/shared-operations/ci-p8-operations-deployment.json \
            --operations-observability build/shared-operations/ci-p8-operations-observability.json \
            --operations-recovery build/shared-operations/ci-p8-operations-recovery.json \
            --operations-runbooks build/shared-operations/ci-p8-operations-runbooks.json \
            --corrective build/validation/ci-p8-18-runtime-product-corrective.json \
            --corrective-invocation build/validation/ci-p8-18-runtime-extension-invocation.json \
            --corrective-kit build/validation/ci-p8-18-developer-kit-binding.json \
            --corrective-output build/validation/ci-p8-18-headless-output.json \
            --corrective-deployment build/validation/ci-p8-18-extension-deployment-recovery.json \
            --corrective-security build/validation/ci-p8-18-security.json \
            --corrective-benchmark build/benchmarks/ci-p8-18-runtime-product-corrective.json \
            --report build/validation/ci-p8-17-exit-gate-audit.json \
            --manifest build/validation/ci-p8-17-exit-gate-evidence-manifest.json \
            --subreport-dir build/validation/ci-p8-17-subreports

      - name: Restore audit checkout metadata
        if: always()
        run: git restore --source HEAD --worktree -- README.md

      - &current_contract_46
        name: Engineering contract
        run: >-
          uv run python -m app.infrastructure.contract_check
          --root .
          --report build/validation/ci-engineering.json

      - &current_contract_47
        name: Container configuration
        run: docker compose --env-file .env.example config --quiet

      - &current_contract_48
        name: Documentation and task diff
        run: |
          uv run python scripts/check_docs.py --discover-task-from "${PLANTNEXUS_CI_CHANGE_BASE}" --check-diff --report build/traceability/ci-current-task-report.json

      - name: P2 XS BenchmarkRunner evidence
        env:
          PLANTNEXUS_BENCHMARK_PROFILE: xs
        run: >-
          uv run python scripts/run_benchmark.py
          --profile "${PLANTNEXUS_BENCHMARK_PROFILE}"
          --report build/benchmarks/ci-xs.json

      - name: P2 vertical slice Gate evidence
        run: >-
          uv run python -m app.application.p2_gate_report
          --root .
          --repeat 2
          --report build/validation/ci-p2-vertical-slice-gate.json

      - name: P3 vertical slice Gate evidence
        run: >-
          uv run python -m app.application.p3_gate_report
          --root .
          --repeat 2
          --frontend-report build/validation/ci-p3-frontend-gate.json
          --p2-report build/validation/ci-p2-vertical-slice-gate.json
          --report build/validation/ci-p3-vertical-slice-gate.json

      - name: P4 vertical slice Gate evidence
        run: |
          uv run python -m app.application.p4_gate_report --root . --repeat 2 --frontend-report build/validation/ci-p4-frontend-gate.json --p2-report build/validation/ci-p2-vertical-slice-gate.json --p3-report build/validation/ci-p3-vertical-slice-gate.json --report build/validation/ci-p4-vertical-slice-gate.json
          uv run python -m app.application.p5_portfolio_gate_report --root . --repeat 2 --portfolio-manifest docs/core/p5-portfolio-amendment-manifest.md --frontend-report build/validation/ci-p4-frontend-gate.json --p2-report build/validation/ci-p2-vertical-slice-gate.json --p3-report build/validation/ci-p3-vertical-slice-gate.json --report build/validation/ci-p5-portfolio-gate.json

      - name: P5 capability qualification fresh evidence
        run: >-
          uv run python scripts/p5_capability_qualification.py
          --root .
          --manifest fixtures/simulation/p5/qualification/evidence-manifest.v1.json
          --report build/validation/ci-p5-capability-qualification.json

      - name: P5 Exit Gate independent audit evidence
        run: >-
          uv run python -m app.application.p5_exit_gate_audit
          --root .
          --provider-observation docs/p5-exit-gate-audit-observations.v1.json
          --qualification-report build/validation/ci-p5-capability-qualification.json
          --p5-gate-report build/validation/ci-p5-portfolio-gate.json
          --p4-gate-report build/validation/ci-p4-vertical-slice-gate.json
          --p4-exit-observation docs/p4-exit-gate-audit-observations.v1.json
          --report build/validation/ci-p5-exit-gate-audit.json

      - name: Build package
        run: uv build

      - &enterprise_runtime_image
        name: Build and verify immutable enterprise Runtime image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/enterprise_image_build.py \
            --output build/enterprise-container/staging/ci-${{ github.sha }} \
            --report build/validation/ci-enterprise-image.json
          cp build/enterprise-container/staging/ci-${{ github.sha }}/image-scan.json build/validation/ci-enterprise-image-scan.json
          cp build/enterprise-container/staging/ci-${{ github.sha }}/image-sbom.cdx.json build/validation/ci-enterprise-image-sbom.json
          uv run python infra/enterprise/bootstrap/verify_container.py \
            --image-report build/validation/ci-enterprise-image.json \
            --report build/validation/ci-enterprise-image-bootstrap.json
      - &enterprise_runtime_archive
        name: Retain exact enterprise Runtime image archive
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-enterprise-runtime-image-${{ github.run_id }}
          path: |
            build/enterprise-container/staging/ci-${{ github.sha }}/plantnexus-aps-runtime-0.1.0-linux-amd64.tar
            build/enterprise-container/staging/ci-${{ github.sha }}/plantnexus-aps-runtime-0.1.0-linux-amd64.tar.sha256
          compression-level: 1
          if-no-files-found: error

      - name: Seal full_validation evidence
        run: python -m scripts.ci_execution seal --job full_validation --files build/validation/ci-p8-tests.xml build/validation/ci-p8-17-exit-gate-audit.json build/validation/ci-p8-17-exit-gate-evidence-manifest.json build/validation/ci-enterprise-image*.json --report build/validation/ci-seal-full_validation.json

      - name: Upload machine evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-evidence-${{ github.run_id }}
          path: |
            build/validation/*.json
            build/validation/ci-p8-tests.xml
            build/validation/ci-p8-17-subreports/**
            build/validation/ci-p8-developer-kit-contract-tests.xml
            build/traceability/*.json
            build/benchmarks/*.json
            build/playwright/**
            build/frontend/**
            build/release/**
            build/enterprise-extensions/**
          if-no-files-found: error

  full_operations:
    needs: [classify, full_preflight]
    if: ${{ needs.classify.outputs.full_operations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare declared Runtime packaging metadata
        run: python -m scripts.ci_execution prepare-runtime --report build/validation/ci-operations-runtime-source.json

      - name: P8 non-Production deployment observability and recovery drill
        run: >-
          python scripts/p8_operations_check.py
          --root .
          --deployment-report build/validation/ci-p8-operations-deployment.json
          --observability-report build/validation/ci-p8-operations-observability.json
          --recovery-report build/validation/ci-p8-operations-recovery.json
          --runbook-report build/validation/ci-p8-operations-runbooks.json

      - name: Restore current checkout metadata
        if: always()
        run: git restore --source HEAD --worktree -- README.md

      - name: Seal full_operations evidence
        run: python -m scripts.ci_execution seal --job full_operations --files build/validation/ci-operations-runtime-source.json build/validation/ci-p8-operations-deployment.json build/validation/ci-p8-operations-observability.json build/validation/ci-p8-operations-recovery.json build/validation/ci-p8-operations-runbooks.json --report build/validation/ci-seal-full_operations.json

      - name: Upload P8 operations evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-operations-${{ github.run_id }}
          path: |
            build/validation/ci-operations-runtime-source.json
            build/validation/ci-seal-full_operations.json
            build/validation/ci-p8-operations-deployment.json
            build/validation/ci-p8-operations-observability.json
            build/validation/ci-p8-operations-recovery.json
            build/validation/ci-p8-operations-runbooks.json
          if-no-files-found: error

  frontend_validation:
    needs: [classify, full_preflight]
    if: ${{ needs.classify.outputs.frontend_validation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Current Frontend regression
        working-directory: frontend
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci
          npm run audit:sca -- --report ../build/validation/ci-frontend-sca.json
          npm run licenses:check -- --report ../build/validation/ci-frontend-licenses.json
          npm run lint
          npm run typecheck
          npm exec -- vitest --exclude=e2e/** --run
          npm exec -- playwright install --with-deps chromium
          npm run test:e2e -- --workers=1
          npm run test:p8:e2e -- --workers=1
          npm run build
          npm run build:headless
          mkdir -p ../build/validation
          git rev-parse HEAD > ../build/validation/ci-frontend-completed.txt
          cp ../build/playwright/results.xml ../build/validation/ci-frontend-browser.xml
          cp ../build/playwright/p8-distribution/results.xml ../build/validation/ci-frontend-headless.xml
      - name: Seal frontend_validation evidence
        run: python -m scripts.ci_execution seal --job frontend_validation --files build/validation/ci-frontend-sca.json build/validation/ci-frontend-licenses.json build/validation/ci-frontend-completed.txt build/validation/ci-frontend-browser.xml build/validation/ci-frontend-headless.xml --report build/validation/ci-seal-frontend_validation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plantnexus-ci-frontend-${{ github.run_id }}
          path: |
            build/validation/ci-frontend-*
            build/validation/ci-seal-frontend_validation.json
            build/playwright/**
          if-no-files-found: error

  solver_validation:
    needs: [classify, full_preflight]
    if: ${{ needs.classify.outputs.solver_validation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLANTNEXUS_POSTGRES_PASSWORD: ci-contract-only-not-a-secret
      PLANTNEXUS_CODE_COMMIT: ${{ github.sha }}
      PLANTNEXUS_BENCHMARK_PROFILE: xs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked
      - *current_contract_1

      - *current_contract_2

      - *current_contract_3

      - *current_contract_4

      - *current_contract_5

      - *current_contract_6

      - *current_contract_7

      - *current_contract_8

      - *current_contract_9

      - *current_contract_10

      - *current_contract_11

      - *current_contract_12

      - *current_contract_13

      - *current_contract_14

      - *current_contract_15

      - *current_contract_16

      - *current_contract_17

      - *current_contract_18

      - *current_contract_19

      - *current_contract_20

      - *current_contract_21

      - *current_contract_22

      - *current_contract_23

      - *current_contract_24

      - *current_contract_25

      - *current_contract_26

      - *current_contract_27

      - *current_contract_28

      - *current_contract_29

      - *current_contract_30

      - *current_contract_31

      - *current_contract_32

      - *current_contract_33

      - *current_contract_34

      - *current_contract_35

      - *current_contract_36

      - *current_contract_37

      - *current_contract_38

      - *current_contract_39

      - *current_contract_40

      - *current_contract_41

      - *current_contract_42

      - *current_contract_43

      - *current_contract_44

      - *current_contract_45

      - *current_contract_46

      - *current_contract_47

      - *current_contract_48

      - name: Current Solver benchmark and packaging
        run: |
          uv run python scripts/run_benchmark.py --profile "${PLANTNEXUS_BENCHMARK_PROFILE}" --report build/benchmarks/ci-current-xs.json
          uv build
      - *enterprise_runtime_image
      - *enterprise_runtime_archive
      - name: Seal solver_validation evidence
        run: python -m scripts.ci_execution seal --job solver_validation --files build/benchmarks/*.json build/validation/*.json --report build/validation/ci-seal-solver_validation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plantnexus-ci-solver-${{ github.run_id }}
          path: |
            build/benchmarks/*.json
            build/validation/*.json
          if-no-files-found: error

  validate:
    needs: [classify, docs_validation, full_preflight, full_backend, frontend_validation, solver_validation, full_validation, full_operations]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: plantnexus-ci-*
          path: build/downloads
      - name: Enforce fail-closed validation routing
        shell: bash
        run: |
          audit_args=()
          if [ "${PLANTNEXUS_PHASE_AUDIT}" = "true" ]; then audit_args+=(--audit); fi
          python -m scripts.ci_execution aggregate "${audit_args[@]}" --report build/validation/ci-aggregate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plantnexus-ci-aggregate-${{ github.run_id }}
          path: build/validation/ci-aggregate.json
          if-no-files-found: error
