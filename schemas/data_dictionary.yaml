schema_set_version: 2.2.0
status: p1_data_quality_gate
spec_version: 0.3.0
rules:
  unknown_root_fields: reject
  implicit_business_defaults: forbidden
  timestamps: RFC3339_UTC_Z
  durations: integer_seconds
  solver_ticks: ceil_duration_seconds_over_tick_seconds
  canonical_ids: non_empty_whitespace_free_strings
  normalization_mapping: exact_profile_and_source_version_required
  unit_conversion_registry: schemas/rules/unit-conversion-registry.v1.yaml
  data_quality_rule_version: data-quality-rules.v1
  error_registry: schemas/rules/error-code-registry.v2.yaml
  schema_set_compatibility: additive_2_2_preserves_import_v2_and_unit_registry_document_versions
schemas:
  canonical-records.v1:
    path: schemas/json/canonical-records.v1.schema.json
    collections:
      - factories
      - workshops
      - production_lines
      - resource_groups
      - resources
      - calendars
      - products
      - routing_versions
      - routing_operations
      - routing_precedence_edges
      - routing_resource_options
      - demand_orders
      - production_orders
      - production_lots
      - execution_facts
      - operation_locks
    required_provenance: [source_system, source_version, source_record_id]
    p1_boundary: strict authority-neutral record shapes; no source mapping, normalization, validation, expansion, or builder behavior
    production_open: [OPEN-001, OPEN-002, OPEN-003, OPEN-004, OPEN-007, OPEN-008, OPEN-009, OPEN-013, OPEN-014, OPEN-015]
  import-package.v1:
    path: schemas/json/import-package.schema.json
    purpose: versioned import metadata envelope
    p0_boundary: canonical record fields remain opaque until P1 authority mapping
    production_open: [OPEN-002, OPEN-013, OPEN-015]
  import-package.v2:
    path: schemas/json/import-package.v2.schema.json
    records: canonical-records.v1
    required_versions: [schema_set_version, source_versions, normalization_rule_version, canonicalization_version]
    synthetic_provenance: required only when synthetic is true
    compatibility: not interchangeable with import-package.v1; v1 remains byte-for-byte preserved
    p1_boundary: Normalization produces deterministic bytes; cross-entity validation and common-ingress orchestration remain planned
    production_open: [OPEN-002, OPEN-013, OPEN-015]
  planning-snapshot.v1:
    path: schemas/json/planning-snapshot.schema.json
    required_fields:
      - snapshot_version
      - snapshot_id
      - cutoff_at
      - source_versions
      - rule_version
      - snapshot_hash
      - entity_counts
      - synthetic
    conditional_fields:
      scenario_id: required only when synthetic is true
    production_open: [OPEN-001, OPEN-015]
  planning-snapshot.v2:
    path: schemas/json/planning-snapshot.v2.schema.json
    payloads: [canonical-records.v1, operation_instances, operation_precedence_edges]
    provenance: [source_versions, rule_version, normalization_rule_version, expansion_version, canonicalization_version, import_package, import_quality_report]
    synthetic_provenance: required only when synthetic is true
    hash_format: sha256 lowercase hexadecimal; construction is owned by TASK-P1-08
    compatibility: not interchangeable with planning-snapshot.v1; v1 remains byte-for-byte preserved
    p1_boundary: immutable payload shape only; validation, expansion, hash builder, and persistence remain planned
    production_open: [OPEN-001, OPEN-002, OPEN-004, OPEN-007, OPEN-009, OPEN-015]
  planning-problem.v1:
    path: schemas/json/planning-problem.schema.json
    required_fields:
      - problem_version
      - snapshot_id
      - problem_builder_version
      - problem_hash
      - tick_seconds
      - horizon_start_utc
      - horizon_end_utc
      - resource_ids
      - operation_instances
      - precedence_edges
      - resource_unavailable_intervals
      - required_capabilities
    operation_duration_fields:
      - setup_seconds
      - cycle_seconds_per_unit
      - final_duration_seconds
      - duration_source
      - source_version
    production_open: [OPEN-004, OPEN-007, OPEN-009, OPEN-014, OPEN-015]
  kpi.v1:
    path: schemas/json/kpi.schema.json
    groups: [delivery, planning, resources, stability, solver]
    production_open: [OPEN-006, OPEN-012]
  error.v1:
    path: schemas/json/error.schema.json
    p0_boundary: category and envelope only; concrete code registry belongs to TASK-P0-04
  validation-report.v1:
    path: schemas/json/validation-report.schema.json
    p0_boundary: top-level and violation envelope only; C-ID rule sheet belongs to TASK-P0-04 and mutation evidence to TASK-P0-07
  error.v2:
    path: schemas/json/error.v2.schema.json
    compatibility: non-interchangeable document version; error.v1 remains unchanged and separately valid
    codes: schemas/rules/error-code-registry.v1.yaml
  error.v3:
    path: schemas/json/error.v3.schema.json
    compatibility: non-interchangeable document version; error.v1/v2 remain unchanged and separately valid
    codes: schemas/rules/error-code-registry.v2.yaml
    required_detail_fields: [entity_type, entity_id, field, observed_value, expected_contract, source_location, action]
  import-quality-report.v1:
    path: schemas/json/import-quality-report.schema.json
    input: import-package.v2
    rule_version: data-quality-rules.v1
    error_document: error.v3
    error_registry: error-code-registry.v2
    determinism: stable issue ordering and content-derived report_id; no generated_at
    p1_boundary: canonical structure/reference/DAG/resource/capability/time/duration/unit evaluation only; no expansion, Snapshot, Problem, ScheduleValidator, or Solver
  validation-report.v2:
    path: schemas/json/validation-report.v2.schema.json
    compatibility: non-interchangeable document version; validation-report.v1 remains unchanged and separately valid
    hard_constraints: C-001..C-011
    rule_sheet: schemas/rules/constraint-rule-sheet.v1.yaml
    mutation_evidence: planned for TASK-P0-07
  state-transition.v1:
    path: schemas/json/state-transition.schema.json
    transition_authority: schemas/rules/state-machines.v1.yaml
    p0_boundary: transition authorization only; persistence and business actions are not implemented
  constraint-rule-sheet.v1:
    path: schemas/rules/constraint-rule-sheet.v1.yaml
    active_constraints: C-001..C-011
    deferred_constraints: C-012..C-018
    p0_boundary: metadata completeness only; candidate schedule evaluation belongs to TASK-P0-07/P2
  unit-conversion-registry.v1:
    path: schemas/rules/unit-conversion-registry.v1.yaml
    dimension: duration
    exact_source_units: [s, min, h]
    canonical_target_unit: second
    arithmetic: positive integer numerator and denominator; non-integral seconds reject
    compatibility: additive in schema set 2.1.0; Import v2 document retains schema_set_version 2.0.0
    production_open: [OPEN-013]
  capability-registry.v1:
    path: schemas/rules/capability-registry.v1.yaml
    p0_boundary: V1_SUPPORTED means contract scope, not current implementation evidence
  error-code-registry.v1:
    path: schemas/rules/error-code-registry.v1.yaml
    categories: [DATA_ERROR, UNSUPPORTED_CAPABILITY, MODEL_INVALID, INFEASIBLE, NO_SOLUTION_WITHIN_LIMIT, VALIDATION_FAILED, SYSTEM_ERROR]
  error-code-registry.v2:
    path: schemas/rules/error-code-registry.v2.yaml
    compatibility: additive; retains all 19 v1 mappings and adds four P1 data-quality codes
    p1_gate_codes: [ROUTE_CYCLE, MISSING_RESOURCE, UNIT_CONVERSION_ERROR, MISSING_DURATION]
  state-machines.v1:
    path: schemas/rules/state-machines.v1.yaml
    machines: [PLANNING_RUN, SCHEDULE_VERSION, EXPORT_JOB]
  factory-profile.v1:
    path: schemas/scenario/factory-profile.schema.json
    asset_version_field: profile_version
    isolation: synthetic_only must be true
    p0_boundary: versioned distribution shape only; no Production defaults or generated factory records
    simulation_assumptions: [SIM-ASSUMPTION-001, SIM-ASSUMPTION-004]
  scenario-spec.v1:
    path: schemas/scenario/scenario-spec.schema.json
    asset_version_field: scenario_version
    deterministic_inputs: [factory_profile, generator, seed, required_capabilities]
    isolation: synthetic_only must be true
    p0_boundary: expected behavior is a contract, not Solver or Validator execution evidence
    simulation_assumptions: [SIM-ASSUMPTION-002, SIM-ASSUMPTION-004, SIM-ASSUMPTION-005]
  scenario-manifest.v1:
    path: schemas/scenario/scenario-manifest.schema.json
    provenance_fields: [scenario, factory_profile, generator, seed, generated_at, dataset_hash]
    hash_rule: generated_at is excluded from canonical Import package dataset_hash
    target_environments: [development, test, benchmark]
    p0_boundary: manifest references an empty Standard Import v1 envelope; canonical entity records remain P1
