name: PlantNexus repository gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plantnexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Classify validation profile
        id: profile
        env:
          PLANTNEXUS_CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLANTNEXUS_CI_CHANGE_HEAD: ${{ github.sha }}
        run: >-
          python scripts/ci_validation_profile.py classify
          --base "${PLANTNEXUS_CI_CHANGE_BASE}"
          --head "${PLANTNEXUS_CI_CHANGE_HEAD}"
          --report build/validation/ci-validation-profile.json
          --github-output "${GITHUB_OUTPUT}"

      - name: Upload validation profile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-profile-${{ github.run_id }}
          path: build/validation/ci-validation-profile.json
          if-no-files-found: error

  docs_validation:
    needs: classify
    if: ${{ needs.classify.outputs.profile == 'DOCS_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate changed public documentation
        env:
          PLANTNEXUS_CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLANTNEXUS_CI_CHANGE_HEAD: ${{ github.sha }}
        run: >-
          python scripts/ci_validation_profile.py validate-docs
          --base "${PLANTNEXUS_CI_CHANGE_BASE}"
          --head "${PLANTNEXUS_CI_CHANGE_HEAD}"
          --report build/validation/ci-public-docs-validation.json

      - name: Upload public documentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-public-docs-${{ github.run_id }}
          path: build/validation/ci-public-docs-validation.json
          if-no-files-found: error

  full_validation:
    needs: classify
    if: ${{ needs.classify.outputs.profile == 'FULL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLANTNEXUS_CODE_COMMIT: ${{ github.sha }}
      PLANTNEXUS_POSTGRES_PASSWORD: ci-contract-only-not-a-secret
      PLANTNEXUS_CI_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify exact Frontend runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Sync exact lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright backend/app backend/tests

      - name: Repository test suites
        run: >-
          uv run pytest -q
          backend/tests/unit
          backend/tests/contract
          backend/tests/simulation
          backend/tests/golden
          backend/tests/validation
          backend/tests/integration
          backend/tests/property
          backend/tests/security

      - name: Existing executable contracts
        run: |
          uv run python -m app.planning.validation.rule_sheet --report build/validation/ci-rule-contracts.json
          uv run python -m app.simulation.generators.contract_check --report build/validation/ci-simulation-contracts.json
          uv run python -m app.simulation.scenarios.golden_fixture --fixture fixtures/deterministic/SIM-MINIMAL-001 --report build/validation/ci-golden.json
          uv run python -m app.planning.validation.mutation_check --root . --report build/validation/ci-validator-mutations.json

      - name: P1 common ingress gate
        run: >-
          uv run python -m app.application.p1_gate_report
          --root .
          --scenario fixtures/synthetic/SIM-P1-INGRESS-001
          --repeat 2
          --report build/validation/ci-p1-data-pipeline.json

      - name: PlanningProblem v1 and v2 contract evidence
        run: >-
          uv run python -m app.planning.problem.contract_check
          --root .
          --report build/validation/ci-planning-problem-contracts.json

      - name: Planning machine contract evidence
        run: >-
          uv run python -m app.planning.policy.contract_check
          --root .
          --report build/validation/ci-planning-machine-contracts.json

      - name: CP-SAT backend foundation evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.contract_check
          --root .
          --report build/validation/ci-solver-backend-foundation.json

      - name: Formal independent schedule validator evidence
        run: >-
          uv run python -m app.planning.validation.problem_validator_check
          --root .
          --report build/validation/ci-formal-schedule-validator.json

      - name: CP-SAT core model evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.core_model_check
          --root .
          --report build/validation/ci-cp-sat-core-model.json

      - name: CP-SAT temporal calendar and material model evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.temporal_model_check
          --root .
          --report build/validation/ci-cp-sat-temporal-model.json

      - name: CP-SAT execution fact and hard lock model evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.fact_lock_model_check
          --root .
          --report build/validation/ci-cp-sat-fact-lock-model.json

      - name: OBJ-001 and Global CP-SAT strategy evidence
        run: >-
          uv run python -m app.planning.backends.cp_sat.objective_strategy_check
          --root .
          --report build/validation/ci-objective-strategy.json

      - name: P2 Golden scenario property and mutation correctness evidence
        run: >-
          uv run python -m app.simulation.scenarios.p2_correctness
          --root .
          --report build/validation/ci-p2-correctness.json

      - name: P2 deterministic reference scheduler evidence
        run: >-
          uv run python -m app.simulation.baselines.reference_schedulers
          --root .
          --report build/validation/ci-reference-schedulers.json

      - name: P2 KPI SolverReport and internal export evidence
        run: >-
          uv run python -m app.exporters.contract_check
          --root .
          --report build/validation/ci-p2-output-contracts.json

      - name: P3 workspace schema contract evidence
        run: >-
          uv run python -m app.domain.workspace_contract_check
          --root .
          --report build/validation/ci-p3-workspace-contracts.json

      - name: P4 dynamic replanning machine contract evidence
        run: >-
          uv run python -m app.domain.execution_contract_check
          --root .
          --report build/validation/ci-p4-machine-contracts.json

      - name: P3 workspace persistence evidence
        run: >-
          uv run python -m app.infrastructure.workspace_persistence_check
          --root .
          --report build/validation/ci-p3-persistence.json

      - name: P4 replan event persistence evidence
        run: >-
          uv run python -m app.infrastructure.replan_persistence_check
          --root .
          --report build/validation/ci-p4-replan-persistence.json

      - name: P4 ExecutionEvent fact projection evidence
        run: >-
          uv run python -m app.application.execution_fact_projection_check
          --root .
          --report build/validation/ci-p4-execution-fact-projection.json

      - name: P4 freeze window and effective lock evidence
        run: >-
          uv run python -m app.planning.problem.freeze_window_check
          --root .
          --report build/validation/ci-p4-freeze-window.json

      - name: P3 reviewable ScheduleVersion lifecycle evidence
        run: >-
          uv run python -m app.application.schedule_version_lifecycle_check
          --root .
          --report build/validation/ci-p3-schedule-version-lifecycle.json

      - name: P3 workspace read model and comparison evidence
        run: >-
          uv run python -m app.application.workspace_read_model_check
          --root .
          --report build/validation/ci-p3-workspace-read-models.json

      - name: P3 schedule edit and lock command evidence
        run: >-
          uv run python -m app.application.schedule_command_check
          --root .
          --report build/validation/ci-p3-schedule-commands.json

      - name: P3 approval rejection and audit evidence
        run: >-
          uv run python -m app.application.approval_decision_check
          --root .
          --report build/validation/ci-p3-approval-decisions.json

      - name: P3 publication supersession and idempotency evidence
        run: >-
          uv run python -m app.application.publication_check
          --root .
          --report build/validation/ci-p3-publication.json

      - name: P3 ExportJob and standard package evidence
        run: >-
          uv run python -m app.application.export_job_check
          --root .
          --report build/validation/ci-p3-export-jobs.json

      - name: P3 planning workspace HTTP API evidence
        run: >-
          uv run python -m app.api.planning_workspace_check
          --root .
          --report build/validation/ci-p3-planning-workspace-api.json

      - name: P3 Frontend locked install
        run: npm --prefix frontend ci

      - name: P3 Frontend point-in-time SCA evidence
        run: >-
          npm --prefix frontend run audit:sca --
          --report ../build/validation/ci-p3-frontend-sca.json

      - name: P3 Frontend license evidence
        run: >-
          npm --prefix frontend run licenses:check --
          --report ../build/validation/ci-p3-frontend-licenses.json

      - name: P3 Frontend lint and type contract
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck

      - name: P3 Frontend component and accessibility tests
        working-directory: frontend
        run: npm exec -- vitest --exclude=e2e/** --run

      - name: P3 Frontend Chromium runtime
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: P3 Frontend human-control and visualization browser evidence
        run: npm --prefix frontend run test:e2e

      - name: P3 Frontend production build
        run: npm --prefix frontend run build

      - name: P3-13 Frontend human-control machine evidence
        run: >-
          npm --prefix frontend run evidence --
          --report ../build/validation/ci-p3-frontend.json

      - name: TASK-P3-16 Frontend bilingual localization machine evidence
        run: >-
          node frontend/scripts/i18n-evidence.mjs
          --report build/validation/ci-p3-frontend-i18n.json

      - name: P3 Gate Chromium replay 1
        working-directory: frontend
        env:
          PLANTNEXUS_P3_GATE_REPLAY_INDEX: "1"
        run: npm exec -- playwright test --config playwright.p3-gate.config.ts

      - name: P3 Gate Chromium replay 2
        working-directory: frontend
        env:
          PLANTNEXUS_P3_GATE_REPLAY_INDEX: "2"
        run: npm exec -- playwright test --config playwright.p3-gate.config.ts

      - name: P3 Gate Frontend semantic evidence
        working-directory: frontend
        run: >-
          node scripts/p3-gate-evidence.mjs
          --human-control-report ../build/validation/ci-p3-frontend.json
          --report ../build/validation/ci-p3-frontend-gate.json

      - name: Engineering contract
        run: >-
          uv run python -m app.infrastructure.contract_check
          --root .
          --report build/validation/ci-engineering.json

      - name: Container configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Documentation and task diff
        run: |
          uv run python scripts/check_docs.py
          uv run python scripts/check_docs.py --discover-task-from "${PLANTNEXUS_CI_CHANGE_BASE}" --check-diff --report build/traceability/ci-current-task-report.json

      - name: P2 XS BenchmarkRunner evidence
        env:
          PLANTNEXUS_BENCHMARK_PROFILE: xs
        run: >-
          uv run python scripts/run_benchmark.py
          --profile "${PLANTNEXUS_BENCHMARK_PROFILE}"
          --report build/benchmarks/ci-xs.json

      - name: P2 vertical slice Gate evidence
        run: >-
          uv run python -m app.application.p2_gate_report
          --root .
          --repeat 2
          --report build/validation/ci-p2-vertical-slice-gate.json

      - name: P3 vertical slice Gate evidence
        run: >-
          uv run python -m app.application.p3_gate_report
          --root .
          --repeat 2
          --frontend-report build/validation/ci-p3-frontend-gate.json
          --p2-report build/validation/ci-p2-vertical-slice-gate.json
          --report build/validation/ci-p3-vertical-slice-gate.json

      - name: Build package
        run: uv build

      - name: Upload machine evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantnexus-ci-evidence-${{ github.run_id }}
          path: |
            build/validation/*.json
            build/traceability/*.json
            build/benchmarks/*.json
            build/playwright/**
          if-no-files-found: error

  validate:
    needs: [classify, docs_validation, full_validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PLANTNEXUS_CI_PROFILE: ${{ needs.classify.outputs.profile }}
      PLANTNEXUS_CLASSIFY_RESULT: ${{ needs.classify.result }}
      PLANTNEXUS_DOCS_RESULT: ${{ needs.docs_validation.result }}
      PLANTNEXUS_FULL_RESULT: ${{ needs.full_validation.result }}
    steps:
      - name: Enforce fail-closed validation routing
        shell: bash
        run: |
          test "${PLANTNEXUS_CLASSIFY_RESULT}" = "success"
          case "${PLANTNEXUS_CI_PROFILE}" in
            FULL)
              test "${PLANTNEXUS_FULL_RESULT}" = "success"
              test "${PLANTNEXUS_DOCS_RESULT}" = "skipped"
              ;;
            DOCS_ONLY)
              test "${PLANTNEXUS_DOCS_RESULT}" = "success"
              test "${PLANTNEXUS_FULL_RESULT}" = "skipped"
              ;;
            *)
              echo "Unknown or missing CI validation profile" >&2
              exit 1
              ;;
          esac
