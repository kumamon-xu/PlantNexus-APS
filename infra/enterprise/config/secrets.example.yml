# Preflight wiring example, not the P8-25 deployment stack. Paths contain no values.
services:
  runtime:
    image: ${RUNTIME_IMAGE:?set an exact approved image tag or digest}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    working_dir: /opt/enterprise
    command: [python, -m, bootstrap.run, --config, /etc/plantnexus/deployment.env, --check]
    cpus: ${CPU_LIMIT:?set a reviewed TEST resource limit}
    mem_limit: ${MEMORY_MIB:?set a reviewed TEST resource limit}m
    tmpfs: [/tmp]
    volumes:
      - ./deployment.env:/etc/plantnexus/deployment.env:ro
      - ./policies:/etc/plantnexus/policies:ro
      - ./tls/server.crt:/etc/plantnexus/tls/server.crt:ro
      - ../bootstrap:/opt/enterprise/bootstrap:ro
    secrets: [db_user, db_password, redis_user, redis_password, broker_user, broker_password, result_user, result_password, identity_token, extension_key, tls_key]
secrets:
  db_user:
    file: ./secrets/db_user
  db_password:
    file: ./secrets/db_password
  redis_user:
    file: ./secrets/redis_user
  redis_password:
    file: ./secrets/redis_password
  broker_user:
    file: ./secrets/broker_user
  broker_password:
    file: ./secrets/broker_password
  result_user:
    file: ./secrets/result_user
  result_password:
    file: ./secrets/result_password
  identity_token:
    file: ./secrets/identity_token
  extension_key:
    file: ./secrets/extension_key
  tls_key:
    file: ./secrets/tls_key
