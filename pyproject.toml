[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "plantnexus-aps"
version = "0.0.0"
description = "PlantNexus APS executable-specification skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "celery==5.5.3",
  "defusedxml==0.7.1",
  "fastapi==0.116.1",
  "openpyxl==3.1.5",
  "opentelemetry-api==1.36.0",
  "ortools==9.15.6755",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "hypothesis==6.165.10",
  "jsonschema==4.25.1",
  "pyright==1.1.411",
  "pytest==8.4.1",
  "PyYAML==6.0.2",
  "ruff==0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.plantnexus-aps.versions]
spec = "0.3.0"
schema = "2.6.0"
code = "0.0.0"
