[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "example-beta-aps-extension"
version = "1.0.0"
description = "Synthetic Beta APS Enterprise Extension"
requires-python = ">=3.12,<3.13"
dependencies = ["aps-extension-sdk==1.0.0"]
authors = [{ name = "PlantNexus Synthetic Reference Beta" }]
license = { text = "LicenseRef-PlantNexus-Synthetic-Reference" }

[project.urls]
Repository = "https://example.invalid/plantnexus/beta-aps-extension"

[tool.hatch.build.targets.wheel]
packages = ["src/example_beta_extension"]

[tool.plantnexus-enterprise-extension]
contract-version = "enterprise-extension-project.v1"
project-id = "com.example.aps.beta"
sdk-api-version = "1.0.0"
runtime-version = "0.1.0"
developer-kit-version = "0.0.0-not-published"
manifest = "extension/extension-manifest.json"
